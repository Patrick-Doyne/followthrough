; The six processes of one FollowThrough instance, kept up by supervisord.
; Logs go to /var/log/followthrough/*.log (docker logs shows supervisord's
; own). The API waits for the tunnel's address (start-api.sh).

[program:caddy]
command=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
autorestart=true
stdout_logfile=/var/log/followthrough/caddy.log
redirect_stderr=true

[program:relay]
command=/usr/bin/node mock-websocket.js
directory=/app/js
autorestart=true
stdout_logfile=/var/log/followthrough/relay.log
redirect_stderr=true

[program:backend]
; Must run from cpp/build: the engine paths are relative to it. SIGINT
; stops it through its own handler.
command=/app/cpp/build/follow_through_webrtc
directory=/app/cpp/build
environment=FT_RELAY_HOST="localhost",FT_RELAY_PORT="8080",FT_STUN_URL="stun:stun.l.google.com:19302",LD_LIBRARY_PATH="/usr/local/cuda-13.3/lib64:/root/kvs-webrtc-sdk/build:/root/kvs-webrtc-sdk/open-source/lib"
autorestart=true
startsecs=5
stopsignal=INT
stdout_logfile=/var/log/followthrough/backend.log
redirect_stderr=true

[program:web]
command=/usr/bin/node .output/server/index.mjs
directory=/app/follow-through-pro-19
environment=PORT="3000",HOST="127.0.0.1",NODE_ENV="production"
autorestart=true
stdout_logfile=/var/log/followthrough/web.log
redirect_stderr=true

[program:tunnel]
; A quick tunnel needs no account or domain and prints a random
; https://<name>.trycloudflare.com address on every start.
command=/usr/bin/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:80
autorestart=true
stdout_logfile=/var/log/followthrough/tunnel.log
redirect_stderr=true

[program:api]
command=/usr/local/bin/start-api.sh
; The offline pipeline the API launches links the same CUDA and TensorRT
; libraries as the live backend, and inherits this from the API.
environment=LD_LIBRARY_PATH="/usr/local/cuda-13.3/lib64:/root/kvs-webrtc-sdk/build:/root/kvs-webrtc-sdk/open-source/lib"
autorestart=true
startsecs=20
stdout_logfile=/var/log/followthrough/api.log
redirect_stderr=true
