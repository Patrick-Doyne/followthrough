spring.application.name=followthrough-api

# 8080 is already taken locally by the signaling relay in js/ (see
# LOCAL_DEV.md); 8081 is where the frontend dev server usually lands.
# Pinned rather than left to Spring Boot's default so this doesn't
# intermittently collide depending on what else is already running.
server.port=8082

# The frontend's default VITE_API_BASE_URL is http://localhost:8082/api/v1
# (see follow-through-pro-19/src/services/http.ts); the port and this
# context path have to agree with it.
server.servlet.context-path=/api/v1

# Frontend dev server origin, for local CORS. Comma-separated if more than
# one origin needs access (e.g. Vite falling back to a different port).
followthrough.cors.allowed-origins=http://localhost:8081

# Temporary bridge DB (see pom.xml's h2 dependency comment): a local H2
# instance so the app boots and the test suite runs before Docker/Postgres
# is wired up. Replace these four properties with real Postgres connection
# settings once that's ready -- nothing else here should need to change,
# since JPA/Hibernate abstract over the two.
#
# On disk rather than in memory. It was jdbc:h2:mem, which meant every
# restart of the backend silently emptied the library: the uploaded files
# themselves survive under followthrough.storage.local.directory below, but
# the rows that index them did not, so the recordings became unreachable.
# That made restarting expensive enough to avoid, and a backend you avoid
# restarting is one that goes on running last week's code -- which is
# exactly how a fixed bug stayed on screen. Both directories are
# gitignored, and deleting local-data/ is the way to start clean.
#
# Tests never touch this file: maven-surefire overrides the URL back to an
# in-memory database (see pom.xml), so a test run neither reads nor writes
# local-data/.
spring.datasource.url=jdbc:h2:file:./local-data/followthrough;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Local stand-in for an S3 bucket (see LocalUploadUrlService and
# LocalPlaybackUrlService) -- uploaded recordings land on disk under this
# directory instead of S3 until a real bucket exists. base-url must match
# this app's own address (server.port + context-path above) since the
# "upload URL" it hands the browser points back at this same backend.
followthrough.storage.local.directory=local-video-storage
followthrough.storage.local.base-url=http://localhost:8082/api/v1

# JWT signing secret (see security/JwtService): HMAC-SHA256, so at least 32
# bytes. Deliberately has no default -- it comes from the environment and the
# app refuses to start without it, so a secret can never end up in source
# control. Locally: export FOLLOWTHROUGH_JWT_SECRET="$(openssl rand -base64 48)"
# before starting (see LOCAL_DEV.md). Every issued token is invalidated when
# it changes. Tests supply their own value through maven-surefire (pom.xml).
followthrough.jwt.secret=${FOLLOWTHROUGH_JWT_SECRET}
followthrough.jwt.expiration-minutes=1440

# Which VideoProcessor handles offline video uploads (see VideoProcessor,
# StubVideoProcessor, CppVideoProcessor). "stub" (the default -- this line
# could be omitted entirely, but is spelled out for discoverability) needs
# no GPU/native toolchain and is what every automated test runs against.
# Set to "cpp" only on a machine with the real CUDA/TensorRT toolchain and
# Node available (see the followthrough.cpp.*/followthrough.node.*
# properties below, which CppVideoProcessor requires once this is "cpp").
# LOCAL_DEV.md runs the API with -Dfollowthrough.processing.engine=cpp.
# Whichever engine runs, the uploaded recording itself is never modified:
# processing writes telemetry and a thumbnail beside it, and the overlay is
# drawn over the video as it plays, in whatever theme the viewer has.

followthrough.processing.engine=stub

# Real offline-processing toolchain -- only read when
# followthrough.processing.engine=cpp. cpp.working-directory must be
# wherever the binary's own TensorRT engine paths resolve correctly from
# (its engine paths are relative to its CWD, not this app's -- it expects
# to run from cpp/build). Paths here assume the standard checkout layout
# (springboot/, cpp/, follow-through-pro-19/ as sibling directories) and
# this app running from springboot/ (its Maven module root).
followthrough.cpp.binary-path=../cpp/build/follow_through_batch_gpu
followthrough.cpp.working-directory=../cpp/build
followthrough.cpp.timeout-minutes=10
followthrough.node.command-prefix=npx,tsx
followthrough.node.prepare-script=scripts/prepare-playback.ts
followthrough.node.working-directory=../follow-through-pro-19
# Was 120 minutes, when this step re-encoded the whole recording with the
# overlay painted in -- roughly 3x real time for a 4K60 clip, so a
# ten-minute upload ran to about half an hour. It no longer re-encodes
# anything: it reads the telemetry as detection writes it and renders a
# single frame for the gallery tile, so what it now waits on is detection
# finishing, not an encode. Left with plenty of headroom for a long clip
# on a slow machine rather than trimmed to the new cost.
followthrough.node.timeout-minutes=30
